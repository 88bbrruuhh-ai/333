title: My PageCMS Blog
description: A simple Jekyll blog managed with PagesCMS
theme: minima

# Important for GitHub Pages if site is served at https://USER.github.io/REPO/
# Replace with your actual values or leave blank if served at root
url: "https://88bbrruuhh-ai.github.io"
baseurl: "/333"

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post


